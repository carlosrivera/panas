version: 1
functions:
    - name: health
      visibility: private
      variable_scope: scoped
      variables: []
    - name: registry
      visibility: public
      invocation_mode: http
      http_auth_mode: none
      variable_scope: scoped
      variables:
          - PANAS_REGISTRY_DATABASE_URL
          - PANAS_DISCOVERY_TOKEN_SHA256
    - name: accounting
      visibility: public
      invocation_mode: http
      http_auth_mode: none
      variable_scope: scoped
      variables:
          - PANAS_REGISTRY_DATABASE_URL
          - PANAS_PLATFORM_PRIVATE_KEY_BASE64
          - PANAS_DESCRIPTOR_KEY_BASE64
    - name: operations
      visibility: private
      variable_scope: scoped
      variables:
          - PANAS_REGISTRY_DATABASE_URL
frontends:
    - name: panas
      variable_scope: scoped
      variables:
          - PUBLIC_REGISTRY_URL
