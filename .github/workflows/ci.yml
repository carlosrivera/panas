name: CI
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
            - name: Reject automated co-author attribution
              shell: bash
              env:
                  PR_BODY: ${{ github.event.pull_request.body || '' }}
              run: |
                  git log --format=%B HEAD > "$RUNNER_TEMP/panas-commit-messages.txt"
                  if grep -Eiq '^Co-authored-by:.*(claude|anthropic)' "$RUNNER_TEMP/panas-commit-messages.txt"; then
                      echo '::error::Remove automated co-author trailers and rebase onto current main. Do not merge pre-rewrite history.'
                      exit 1
                  fi
                  if printf '%s\n' "$PR_BODY" | grep -Ei 'generated (with|by).*claude|^Co-authored-by:.*(claude|anthropic)' > /dev/null; then
                      echo '::error::Remove automated attribution from the pull request description.'
                      exit 1
                  fi
            - uses: pnpm/action-setup@v6.1.0
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm check
            - run: pnpm release:pack && pnpm release:smoke
    accounting-database:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: panas
                    POSTGRES_PASSWORD: local-ci-only
                    POSTGRES_DB: panas_test
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U panas -d panas_test"
                    --health-interval 5s --health-timeout 5s --health-retries 10
        env:
            PANAS_ACCOUNTING_TEST_DATABASE_URL: postgres://panas:local-ci-only@127.0.0.1:5432/panas_test
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: pnpm/action-setup@v6.1.0
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm test:accounting-db
            - run: pnpm exec vitest run packages/registry/src/postgres.test.ts
              env:
                  PANAS_REGISTRY_TEST_DATABASE_URL: postgres://panas:local-ci-only@127.0.0.1:5432/panas_test
    docker-sandbox:
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: pnpm/action-setup@v6.1.0
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: ./docker/build.sh
            - run: pnpm exec tsx scripts/release/sandbox-smoke.ts
            - run: pnpm exec tsx scripts/release/native-peer-smoke.ts
